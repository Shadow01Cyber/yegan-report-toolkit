<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report @YeganHjAmir</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:monospace;padding:20px;min-height:100vh}
h1{color:#f0883e;margin-bottom:10px;font-size:1.3em}
.info{background:#161b22;border:1px solid #f0883e;border-radius:8px;padding:15px;margin-bottom:20px}
.info span{color:#f0883e;font-weight:bold}
.btn{display:inline-block;padding:12px 24px;border-radius:6px;border:none;font-family:monospace;font-size:15px;cursor:pointer;margin:5px;font-weight:bold}
.send{background:#238636;color:#fff}
.send:hover{background:#2ea043}
.skip{background:#21262d;color:#c9d1d9;border:1px solid #30363d}
.copy{background:#1f6feb;color:#fff}
.progress{background:#161b22;border-radius:8px;padding:10px 15px;margin-bottom:15px;border:1px solid #30363d}
.bar{height:8px;background:#21262d;border-radius:4px;margin-top:8px;overflow:hidden}
.fill{height:100%;background:#f0883e;border-radius:4px;transition:width .3s}
.subject{background:#161b22;padding:12px;border-radius:6px;border:1px solid #30363d;margin:10px 0;font-size:13px}
.email-body{background:#0d1117;padding:15px;border-radius:6px;border:1px solid #30363d;margin:10px 0;max-height:350px;overflow-y:auto;font-size:13px;line-height:1.6;white-space:pre-wrap}
.to{color:#58a6ff;margin-bottom:10px;font-size:13px}
.auto-badge{display:inline-block;background:#238636;color:#fff;padding:3px 10px;border-radius:10px;font-size:11px;margin-left:8px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.counter{font-size:2em;color:#f0883e;font-weight:bold;text-align:center;margin:20px 0}
.timer{color:#8b949e;font-size:12px;text-align:center;margin-top:5px}
.sent-log{max-height:150px;overflow-y:auto;margin-top:15px;border-top:1px solid #30363d;padding-top:10px}
.sent-item{color:#8b949e;font-size:11px;padding:2px 0}
.done{color:#3fb950;font-size:1.5em;text-align:center;margin:30px 0}
</style>
</head>
<body>

<h1>🔓 Report @YeganHjAmir <span class="auto-badge">AUTO-SEND</span></h1>

<div class="info">
<b>Channel:</b> <span>@YeganHjAmir</span> (ID: <span>-1002800797699</span>)<br>
<b>Owner:</b> <span>@ip_1998</span><br>
<b>Violation:</b> Non-consensual intimate images + verbal abuse + 5k fake members
</div>

<div class="to">
<b>To:</b> abuse@telegram.org, privacy@telegram.org
</div>

<div class="progress">
Sent: <span id="sent-count">0</span> / 70
<div class="bar"><div class="fill" id="progress-fill"></div></div>
</div>

<div class="counter" id="counter">0</div>
<div class="timer" id="timer">Opening email app in <span id="countdown">5</span>s...</div>

<div id="subject" class="subject"></div>
<div id="email-body" class="email-body"></div>

<div style="margin-top:15px;text-align:center">
<button class="btn send" onclick="sendNow()">📤 Send Now</button>
<button class="btn copy" onclick="copyReport()">📋 Copy</button>
<button class="btn skip" onclick="nextReport()">⏭ Skip</button>
</div>

<div class="sent-log" id="sent-log"></div>

<div id="done-msg" class="done" style="display:none">✅ ALL 70 REPORTS SENT!</div>

<script>
const REPORTS = REPORTS_PLACEHOLDER;
let sent = JSON.parse(localStorage.getItem('yegan_sent_v5') || '[]');
let currentReport = null;
let countdownTimer = null;
let countdownValue = 5;

function pickNext() {
    const unsent = REPORTS.filter(r => !sent.includes(r.id));
    if (unsent.length === 0) return null;
    return unsent[Math.floor(Math.random() * unsent.length)];
}

function showReport(r) {
    currentReport = r;
    document.getElementById('subject').textContent = 'Subject: ' + r.subject;
    document.getElementById('email-body').textContent = r.body;
    document.getElementById('counter').textContent = (sent.length + 1);
    document.getElementById('timer').style.display = '';
    document.getElementById('done-msg').style.display = 'none';
    startCountdown();
}

function startCountdown() {
    countdownValue = 5;
    document.getElementById('countdown').textContent = countdownValue;
    if (countdownTimer) clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
        countdownValue--;
        document.getElementById('countdown').textContent = countdownValue;
        if (countdownValue <= 0) {
            clearInterval(countdownTimer);
            sendNow();
        }
    }, 1000);
}

function sendNow() {
    if (countdownTimer) clearInterval(countdownTimer);
    if (!currentReport) return;
    const r = currentReport;
    var link = document.createElement('a');
    link.href = 'mailto:abuse@telegram.org,privacy@telegram.org?subject=' + encodeURIComponent(r.subject) + '&body=' + encodeURIComponent(r.body);
    link.click();
    markSent(r.id);
}

function copyReport() {
    if (!currentReport) return;
    const r = currentReport;
    const text = 'To: abuse@telegram.org, privacy@telegram.org\nSubject: ' + r.subject + '\n\n' + r.body;
    navigator.clipboard.writeText(text).then(() => {
        alert('✅ Copied! Paste into Gmail.');
    });
}

function nextReport() {
    if (countdownTimer) clearInterval(countdownTimer);
    if (currentReport) {
        markSent(currentReport.id);
    }
}

function markSent(id) {
    if (!sent.includes(id)) {
        sent.push(id);
        localStorage.setItem('yegan_sent_v5', JSON.stringify(sent));
    }
    updateProgress();
    const next = pickNext();
    if (next) {
        showReport(next);
    } else {
        document.getElementById('subject').textContent = '✅ ALL 70 REPORTS SENT';
        document.getElementById('email-body').textContent = 'Done! All reports have been sent.';
        document.getElementById('timer').style.display = 'none';
        document.getElementById('counter').textContent = '70';
        document.getElementById('done-msg').style.display = 'block';
    }
}

function updateProgress() {
    const count = sent.length;
    document.getElementById('sent-count').textContent = count;
    document.getElementById('progress-fill').style.width = (count/70*100) + '%';
    const log = document.getElementById('sent-log');
    log.innerHTML = sent.slice().reverse().map(id => {
        const r = REPORTS.find(x => x.id === id);
        return r ? '<div class="sent-item">✅ #' + r.id + ': ' + r.subject.substring(0,50) + '...</div>' : '';
    }).join('');
}

// Start
const first = pickNext();
if (first) showReport(first);
else {
    document.getElementById('subject').textContent = '✅ ALL SENT';
    document.getElementById('timer').style.display = 'none';
    document.getElementById('done-msg').style.display = 'block';
}
</script>
</body>
</html>
