    const r = REPORTS.find(x => x.id === current);
    if (!r) return;
    const text = 'To: abuse@telegram.org\nCC: grievance-in@telegram.org, durov@telegram.org, dsa.telegram@edsr.eu\nSubject: ' + r.subject + '\n\n' + r.body;
    navigator.clipboard.writeText(text).then(() => alert('Copied!'));
}

function skipReport() {
    const r = REPORTS.find(x => x.id === current);
    if (r) showReport();
}

function markSent(id) {
    if (!sent.includes(id)) {
        sent.push(id);
        localStorage.setItem('yegan_sent', JSON.stringify(sent));
    }
    updateProgress();
    showReport();
}

function updateProgress() {
    const count = sent.length;
    document.getElementById('sent-count').textContent = count;
    document.getElementById('progress-fill').style.width = (count/70*100) + '%';
    document.getElementById('badge').textContent = count + '/70';
    const list = document.getElementById('sent-list');
    list.innerHTML = sent.map(id => {
        const r = REPORTS.find(x => x.id === id);
        return r ? `<div class="sent-item">✅ #${r.id}: ${r.subject}</div>` : '';
    }).join('');
}

showReport();
</script>
</body>
</html>
